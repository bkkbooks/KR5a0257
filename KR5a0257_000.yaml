body:
  text: 豁落符太微天帝君金虎真符太微天帝君金虎真符藏于太元上景瓊宫毒獸萬尋擊魔衛經神虎七千備于玉闕西華玉女三百人散香霄庭五老典籍金晨侍真非有瓊録玉名刻簡三清者皆不得金虎內符及聞太上之玉篇矣此符本刻于上清玉簡智慧篇中有七十萬言靈音道妙微旨難詳或著天魔隱諱或表萬神內名或釋幽喻疑決于瓊音也小有王君抄出此符及威神內文之法以制天地群靈有一百言耳此祝竒祕名曰三天虎書太元上録受之者先齋七十日齎金虎玉鈴素錦玄羅各三十尺以為金真之誓盟于天地不宣之約依四極明科聽使七百年中得傳三人太微天帝君金虎玉精真符乃太元上景自然金章之內音也以役命金仙封山召雲威震六天馘洛萬神太上恆以西靈太甲七十萬人衛符於太微瓊宫佩此符者滅制天地呵叱群靈控駕景龍位司髙仙瓊音既震則玉華侍側金真衛兵千祅喪眸萬鬼滅形九魔併首六天摧傾道妙極真神裒五靈左嘯玄童右攝金晨大哉寶文太帝威真豈徒辟毒禳試滅妖而巳乃求仙之妙品得真之標格右金虎真符太微天帝君以傳金闕帝君朱書白素請以紫錦囊佩之頭上以行則制命天地群靈神仙敬服玉華散巾天丁衛軀山兵稽精加敕威神之祝玉精之章便得馘斬九魔千妖滅形矣此上清禁符不傳於世得佩之者飛升上清太元上景金真威神內祝以役右神兵斬滅邪魂當入室燒香叩齒三十六通坐卧任意乃祝之曰辟乾毒王震拾羅旍八仙秉鉞上帝五靈太玄落景七晨衛庭黃真曜符煥擲火鈴神虎奮豪毒鋒亂呈紫勃文儀四躩仰鳴九天六天四天皛晶外纒玄氣內守師兵左威右顧風伐火征叱斬萬妖摧馘千精金天威震九魔攝形北酆摧落所滅皆傾我佩真符役使萬靈三元告真玄合帝誠太微上命上升三清太元上景威神內祝之法皆上清之禁經也辟乾毒王者是六天大鬼之內名也震拾羅旍者是北帝魔王之隱議也四天皛晶者是北酆鬼相之魂名也能知三鬼名者則千妖竄迹萬鬼匿形九魔莫得而動試觀弗得而陳矣山林獨處及在符廟神鬼之中便可案而㣔事不必燒香入室也又以雌黃書碧繒長三尺廣一尺二寸亦可都方圓一尺二寸也以朱四郭其外并以丹錦緣厠其裏帶於腰中之右面也若登齋入室及朝宴八元并制魔召靈驅䇿神真者便佩而行事也慎不可臨見尸穢罪同漏泄七玄之祖拷于地獄玉景九天金霄威神王祝太元上經
