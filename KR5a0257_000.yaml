front:
  text: 玉景九天金霄威神王祝太元上經果四凡有宿命應得此文者皆當盟授割血為約信誓九天然後傳之依太上西靈之科聽二千二百年中得傳三人玉景上元太虎符者是九天金霄威神王之內靈合曜二景之寶文也道妙極真氣交上元玉皇所寶衆帝所尊佩之者役景精升九晨滅鬼魔制萬神見其文者皆有真仙之挺延七世之福慶也若遭遇師匠啓授之後長齋苦寂不交風塵者乃可帶豁落神符威祝內靈流煥太虛感擢三清者耳於是神仙伏拜凶試滅迹兆命長延於密慎監者看視功過之所履太上恆以西靈大甲七千萬人神虎七千給衛景精中王侍文於太元西瑶臺焉景精中王者太上金霄威神王之內名也能知威神王之名者則天下鬼神無不伏諾於兆也此之神王則是玉精天元之上靈神虎金霄之威真也是故佩其文則六天威度秉其符則三官來臣禮其室則玉華促詣説其祝則神虎開津威落八虛靈洞九晨梟馘群魔奮躩大姦山嶽稽精河海伏源嘯吒十方役命神仙壽同三光威曜太元斯誠上清之竒文景精之威章也凡授此神文必當審擇其人宿契冥會果分神仙者然後請太師口命法師保舉經師告盟求神靈之符應招感氣之妙悟詳察微兆以決會動之機要也若不奉太師之命又不承法師之保舉而妄傳以為盟者雖遇其仙之挺玉名之童兆之七祖猶見考於冥科也是故不盟而授者經師當死魂役於水官弟子獲天火之考盟而不𧵥者經師滅於苦道弟子受鬼魔之化所以崇盟信誓不輕泄也是以水火為異天之罰九魔為苦毒之梁魂罰胎零長考太幽雖優遊洞宅乞請帝靈然萬遍不開其罪陳願不聞其辭七玄長考於地獄焉神仙之可期天科告驗兆慎之哉若欲驅除六天之鬼靈攝伐凶邪之毒氣及當破誅符廟者兆祕行威神王大祝之法先叩齒三十六通因存景精中王從我六合洞房宫中出於面前對兆之鼻上令去鼻一寸景精中王形長七寸素華晨冠上下皆著素錦衣裳口吐金真之氣鬱鬱然如白雲之狀令白雲之氣流扇四方之內皆冠匝兆身而前行也又存白煙之中忽有朱精顯煥飛光激揚如流星之狀於倐歘又變成數百神虎奮躩前驅即巳摧裂向所捕之鬼賊也畢乃祝曰太上明威金霄內真景精中王放氣攝神幽寥備宅上帝司臣景煙流曜洞合九天威文朗發神虎開津靈雲鬱藹朱精虛扇七化文人九霄揮真敢當吾者馘裂邪身凶試伏妖姦毒摧泯萬魔一滅雙景合鎮俱與威王上升帝晨太元竒逸保我利貞祝畢又叩齒三十六通然後可以誅伐符魔制伏萬神氣蕩寒靈攝伏六天於是千妖萬毒皆已自滅於未祝之前也此威王之祝既已妙重又是髙真所寶其文皆藏於九天玉清之上太元西靈之臺寶禁之科不傳於世自非金名羽籍玄慶盈溢者永不見威王之大法也唯位登髙仙為上清之公卿及帝晨之賔者乃得帶佩此符耳兆但行大祝之始則髙元列轡上帝舞霄金真迅卒景精攝寮玄龍吐毒神虎右號馘滅萬魔叱斬千妖六天為之摧落山嶽為之啓朝玉華詣寢紫童回蓋天皇助威九霄玄泰凶毒寒消水征火伐千億丘蕩八虛浪豁於是神安氣調無注無滯金景齊晨靈仙合契奉我神符玄福萬世玉景九天金霄威神王太元上經大虎符兆若經履急難及有驚畏心震之地者但密呼景精中王名三過心念其神如有營護我之左右者則千災萬禍無不蒙濟姦試滅凶妖毒皆亡又臨卧常叩齒二七過并祝念神名令人魂魄保鎮尸鬼受閉又除惡夢去不祥夫傳授此文經師及弟子對齋告盟二十一日日竟授經盟用素綺碧羅各三十七尺金魚一雙各重一兩以為太上西靈寶禁之科約也此之信物皆當歸奉於太師法師之門以營神靈之公用若私割以自贍貪濫以為利不從天科之約始衒大信於盟初者經師七玄之祖拷于北冥之獄永無仙果帶此符之法以朱書白素長三尺以紫錦為囊盛之於心前欲行神祝之時皆當佩之兆佩此符以制天地鬼神驅伐六天之寒靈摧戮九魔之凶氣兆命延長於天地司髙仙於太極落靈符於形軀陳威王之大法神官啓拜金兵輔衛水火俱過試觀長絶是故三官北帝莫敢窺其間隙也兆既奉受神文但寶録朝禮而巳不可便佩帶於人間也若輕泄寶文及宣露威王之名者太上皆巳拷毒於七玄之祖見噬於神虎之口兆之魂胎亦即受閉於地獄身命俱滅於水火之罰七百年中乃更化於疣疵之胞施惡癩之疾於九宗之親二師輕舉其人弟子妄受其文者罪亦同此罰也若升仙之日當帶豁落神文朝謁上宫以朱書白素七尺長牒辟之令廣五寸如水帶之狀以素羅若緑繒一丈四尺為衣黃夾亦如符法帶於腰中也所謂鳳文虎帶豁落七元者也若長齋之士朝禮之日皆佩之
